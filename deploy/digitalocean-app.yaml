name: dieta-ai
region: fra
domains:
  - domain: kaloria.uz
    type: PRIMARY
  - domain: www.kaloria.uz
    type: ALIAS
services:
  - name: api
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 5
      success_threshold: 1
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_ADMIN_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AI_INTEGRATIONS_OPENROUTER_BASE_URL
        scope: RUN_TIME
        value: https://openrouter.ai/api/v1
      - key: TELEGRAM_REQUEST_TIMEOUT_MS
        scope: RUN_TIME
        value: "30000"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://kaloria.uz
      - key: SITE_PRICES
        scope: RUN_TIME
        value: '{"ozish":159000,"balans":179000,"sport":209000}'
      - key: SITE_DISCOUNTS
        scope: RUN_TIME
        value: '{"d3":0,"w1":0,"w2":3,"w3":5,"w4":7,"m1":10}'
      - key: MANAGER_TELEGRAM_URL
        scope: RUN_TIME
        value: https://t.me/your_manager
      - key: MANAGER_PHONE
        scope: RUN_TIME
        value: "+998901234567"
      - key: TELEGRAM_LEADS_CHAT_ID
        scope: RUN_TIME
        type: SECRET
      - key: META_PIXEL_ID
        scope: RUN_TIME
        value: ""
      - key: TIKTOK_PIXEL_ID
        scope: RUN_TIME
        value: ""
      - key: ADMIN_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_OWNER_TELEGRAM_IDS
        scope: RUN_TIME
        value: ""
